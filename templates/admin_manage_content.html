<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Content</title>
</head>
<body style="font-family:Arial,sans-serif;margin:0;padding:15px;background:#f5f7f7;">

<h1 style="font-size:42px;">📚 Manage Content</h1>

<p>
    <a href="/admin-dashboard" style="font-size:20px;">← Back to Admin Dashboard</a>
</p>

{% if media %}
    {% for item in media %}
    <div style="background:white;border:1px solid #ccc;padding:25px;margin:20px 0;border-radius:8px;">

        <h2>{{ item['title'] }}</h2>

        <p><strong>Type:</strong> {{ item['file_type'] }}</p>

        <p><strong>Author:</strong> {{ item['author'] or '—' }}</p>

        <p>{{ item['description'] or '' }}</p>

        <p>
            <a href="{% if item['file_type'] == 'Audio' %}{{ url_for('download_audio', filename=item['file_path'].replace('audios/', '')) }}{% elif item['file_type'] == 'Video' %}{{ url_for('download_video', filename=item['file_path'].replace('videos/', '')) }}{% elif item['file_path'].startswith('http') %}{{ item['file_path'] }}{% else %}{{ url_for('static', filename=item['file_path']) }}{% endif %}"
               target="_blank"
               style="font-size:20px;">
                👁️ View / Open
            </a>
        </p>

        <p>
            <a href="{{ url_for('admin_edit_content', content_id=item['id']) }}"
               style="display:inline-block;background:#087f3e;color:white;padding:12px 22px;border-radius:7px;text-decoration:none;font-size:18px;">
                ✏️ Edit
            </a>
        </p>

        <form method="POST"
              action="{{ url_for('admin_delete_content', content_id=item['id']) }}"
              onsubmit="return confirm('Delete this content?');">
            <button type="submit"
                    style="background:#c62828;color:white;border:0;padding:12px 22px;border-radius:7px;font-size:18px;">
                🗑️ Delete
            </button>
        </form>

    </div>
    {% endfor %}
{% else %}
    <p>No content found.</p>
{% endif %}

</body>
</html>
