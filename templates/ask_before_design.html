<!DOCTYPE html> <html lang="en"> <head> 
    <meta charset="UTF-8"> <meta 
    name="viewport" 
    content="width=device-width, 
    initial-scale=1.0"> <title>Ask a 
    Question - Darul Bahs Wal 
    Ifta</title> <style>
        body { margin: 0; font-family: 
            Arial, sans-serif; 
            background: #f3fff6; color: 
            #222;
        }
        header { background: #087f3e; 
            color: white; text-align: 
            center; padding: 25px 15px;
        }
        header h1 { margin: 0; font-size: 
            30px;
        }
        header h2 { margin: 10px 0 0; 
            font-size: 22px;
        }
        .container { max-width: 600px; 
            margin: 30px auto; padding: 
            20px;
        }
        h3 { color: #087f3e; text-align: 
            center; font-size: 28px;
        }
        label { display: block; 
            margin-top: 18px; 
            font-weight: bold;
        }
        input, textarea { width: 100%; 
            padding: 14px; margin-top: 
            8px; border: 1px solid #ccc; 
            border-radius: 8px; 
            font-size: 16px; box-sizing: 
            border-box;
        }
        textarea { height: 180px; resize: 
            vertical;
        }
        button { width: 100%; margin-top: 
            25px; padding: 15px; 
            background: #087f3e; color: 
            white; border: none; 
            border-radius: 8px; 
            font-size: 18px; font-weight: 
            bold;
        }
        button:active { background: 
            #066b34;
        }
        .back { display: block; 
            text-align: center; 
            margin-top: 20px; color: 
            #087f3e;
            text-decoration: none; 
            font-weight: bold;
        }
    </style> </head> <body> <header> 
    <h1>دار البحث والإفتاء</h1> <h2>Darul 
    Bahs Wal Ifta</h2>
</header> <div class="container"> <h3>❓ 
    Ask a Question</h3> <form 
    id="questionForm">
        <label>Your Name</label> <input 
        type="text" id="name" 
        placeholder="Enter your name" 
        required> <label>Your 
        Question</label> <textarea 
        id="question"
                  placeholder="Write your 
                  Islamic question 
                  here..." 
                  required></textarea>
        <button type="submit"> 📤 Submit 
            Question
        </button> </form> <a href="/" 
    class="back">← Back to Home</a>
</div> <script> 
document.getElementById("questionForm").addEventListener("submit", async function(e) { 
    e.preventDefault(); const name = 
    document.getElementById("name").value; 
    const question = 
    document.getElementById("question").value; 
    const response = await 
    fetch("/questions", {
        method: "POST", headers: { 
            "Content-Type": 
            "application/json"
        },
        body: JSON.stringify({ name: 
            name, question: question
        })
    });
    const data = await response.json(); 
    if (response.ok) {
        alert("An karɓi tambayarka cikin 
        nasara!"); 
        document.getElementById("questionForm").reset();
    } else {
        alert(data.error || "An samu 
        matsala.");
    }
});
</script> </body>
</html>
