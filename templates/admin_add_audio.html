<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Audio - Darul Bahs Wal Ifta'</title>
</head>
<body>
    <h1>🎧 Add Audio</h1>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    <form method="POST" enctype="multipart/form-data">
        <label>Title:</label><br>
        <input type="text" name="title" required><br><br>

        <label>Speaker / Author:</label><br>
        <input type="text" name="author"><br><br>

        <label>Description:</label><br>
        <textarea name="description" rows="5"></textarea><br><br>

        <label>Audio File:</label><br>
        <input type="file" name="file" accept=".mp3,.m4a,.wav,.ogg,.aac" required><br><br>

        <button type="submit">Upload Audio</button>
    </form>

    <br>
    <a href="/admin-dashboard">← Back to Admin Dashboard</a>
</body>
</html>
