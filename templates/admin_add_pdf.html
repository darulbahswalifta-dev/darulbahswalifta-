<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Add PDF</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="font-family:Arial; padding:20px;">

<h1>📚 Add PDF</h1>

<p><a href="{{ url_for('admin_dashboard') }}">← Back to Admin Dashboard</a></p>

{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}

<form method="POST" enctype="multipart/form-data">

    <label>Title</label><br>
    <input type="text" name="title" required
           style="width:100%; padding:12px; margin:8px 0 15px;"><br>

    <label>Author</label><br>
    <input type="text" name="author"
           style="width:100%; padding:12px; margin:8px 0 15px;"><br>

    <label>Description</label><br>
    <textarea name="description" rows="5"
              style="width:100%; padding:12px; margin:8px 0 15px;"></textarea><br>

    <label>Choose PDF</label><br>
    <input type="file" name="file" accept=".pdf,application/pdf" required
           style="margin:10px 0 20px;"><br>

    <button type="submit"
            style="background:#087f3e; color:white; border:0;
                   padding:14px 25px; border-radius:8px; font-size:17px;">
        📤 Upload PDF
    </button>

</form>

</body>
</html>
