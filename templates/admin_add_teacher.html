
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Teacher - Darul Bahs Wal Ifta</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f8f4;
            margin: 0;
            padding: 0;
        }

        .header {
            background: #0b7a3b;
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        .header h1 {
            margin: 0;
            color: #ffd700;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            background: #0b7a3b;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
        }

        .back {
            display: block;
            margin-top: 15px;
            text-align: center;
            color: #0b7a3b;
            text-decoration: none;
        }

        .error {
            background: #ffe5e5;
            color: #b00020;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>دار البحث والإفتاء</h1>
    <p>Admin — Add Teacher / Scholar</p>
</div>

<div class="container">

    <div class="card">

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">

            <label>Teacher / Scholar Name</label>
            <input type="text" name="name" required>

            <label>Specialization</label>
            <input type="text" name="specialization" required>

            <label>Biography</label>
            <textarea name="bio"></textarea>

            <label>Username</label>
            <input type="text" name="username" required>

            <label>Password</label>
            <input type="password" name="password" required>

            <button type="submit">
                Add Teacher / Scholar
            </button>

        </form>

        <a class="back" href="{{ url_for('get_teachers') }}">
            ← Back to Teachers / Scholars
        </a>

    </div>

</div>

</body>
</html>
