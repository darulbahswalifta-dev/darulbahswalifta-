<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - Darul Bahs Wal Ifta</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f7f5;display:flex;justify-content:center;align-items:center;min-height:100vh}
.box{width:90%;max-width:400px;background:white;padding:30px;border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.12);text-align:center}
.logo{font-size:42px;color:#0b7a3b;margin-bottom:5px}
h1{color:#0b7a3b;margin:5px 0}
.sub{color:#777;margin-bottom:25px}
input{width:100%;box-sizing:border-box;padding:14px;margin:8px 0;border:1px solid #ddd;border-radius:10px;font-size:16px}
button{width:100%;padding:14px;margin-top:15px;background:#0b7a3b;color:white;border:0;border-radius:10px;font-size:17px;font-weight:bold}
button:hover{background:#075c2d}
.error{color:#c62828;background:#ffebee;padding:10px;border-radius:8px;margin-bottom:12px}
.footer{margin-top:25px;color:#999;font-size:13px}
</style>
</head>
<body>
<div class="box">
<div class="logo">دار البحث والإفتاء</div>
<h1>Admin Login</h1>
<div class="sub">Darul Bahs Wal Ifta</div>
{% if error %}
<div class="error">{{ error }}</div>
{% endif %}
<form method="POST">
<input type="text" name="username" placeholder="Username" required>
<input type="password" name="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
<div class="footer">Nashr al-Ilm al-Sahih</div>
</div>
</body>
</html>
