<!DOCTYPE html>
<html lang="ha">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiqhu da Fatawa</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4faf7;
            margin: 0;
            padding: 25px;
            text-align: center;
        }

        h1 {
            color: #147a46;
            font-size: 34px;
            margin-bottom: 10px;
        }

        h2 {
            color: #111;
            font-size: 30px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 22px;
            max-width: 600px;
            margin: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            text-align: left;
        }

        .card p {
            font-size: 20px;
            line-height: 1.7;
        }

        .back {
            display: inline-block;
            margin-top: 30px;
            background: #147a46;
            color: white;
            padding: 15px 28px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 19px;
        }
    </style>
</head>

<body>

    <h1>دار البحث والإفتاء</h1>

    <h2>Fiqhu da Fatawa</h2>

    <div class="card">

        <p>
            Wannan sashe ya ƙunshi darussa da nazarce-nazarce
            a fannin Fiqhu da Fatawa bisa Alƙur'ani da Sunnah.
        </p>

        <p>
            Za a ƙara muhimman fatawowi da bayanai daga
            malamai a wannan sashe.
        </p>

    </div>

    <a class="back" href="/studies">← Komawa Nazari</a>

</body>
</html>
